<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="10" fill="#1E1B4B"/>
  <!-- Step 1 Circle -->
  <circle cx="12" cy="18" r="5" fill="#4F46E5"/>
  <text x="12" y="21" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFF" text-anchor="middle">1</text>
  <!-- Forward Arrow 1-2 -->
  <path d="M17 18H21" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
  <!-- Step 2 Circle -->
  <circle cx="26" cy="18" r="5" fill="#06B6D4"/>
  <text x="26" y="21" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFF" text-anchor="middle">2</text>
  <!-- Forward Arrow 2-3 -->
  <path d="M31 18H35" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
  <!-- Step 3 Circle (Compensated) -->
  <circle cx="40" cy="18" r="5" fill="#F43F5E"/>
  <text x="40" y="21" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFF" text-anchor="middle">3</text>
  <!-- Compensation Rollback Curved Arrow -->
  <path d="M40 24 C40 33, 12 33, 12 24" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
  <polygon points="12,23 9,27 15,27" fill="#FB7185"/>
</svg>
