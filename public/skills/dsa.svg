<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="10" fill="#18181B"/>
  <!-- Binary Tree Edges -->
  <line x1="24" y1="12" x2="14" y2="24" stroke="#4B5563" stroke-width="2"/>
  <line x1="24" y1="12" x2="34" y2="24" stroke="#F59E0B" stroke-width="2"/>
  <line x1="14" y1="24" x2="9" y2="36" stroke="#4B5563" stroke-width="2"/>
  <line x1="14" y1="24" x2="19" y2="36" stroke="#4B5563" stroke-width="2"/>
  <line x1="34" y1="24" x2="29" y2="36" stroke="#F59E0B" stroke-width="2"/>
  <line x1="34" y1="24" x2="39" y2="36" stroke="#4B5563" stroke-width="2"/>
  <!-- Root Node -->
  <circle cx="24" cy="12" r="5" fill="#F59E0B"/>
  <circle cx="24" cy="12" r="2" fill="#FFF"/>
  <!-- Level 1 Nodes -->
  <circle cx="14" cy="24" r="4.5" fill="#3B82F6"/>
  <circle cx="34" cy="24" r="4.5" fill="#10B981"/>
  <!-- Level 2 Leaf Nodes -->
  <circle cx="9" cy="36" r="3.5" fill="#6B7280"/>
  <circle cx="19" cy="36" r="3.5" fill="#8B5CF6"/>
  <circle cx="29" cy="36" r="3.5" fill="#EC4899"/>
  <circle cx="39" cy="36" r="3.5" fill="#6B7280"/>
</svg>
